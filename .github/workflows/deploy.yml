name: Pubblica il portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recupera il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepara Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
      - name: Installa le dipendenze
        run: npm ci
      - name: Genera il sito
        run: npm run build
      - name: Controlla pagine e immagini
        run: node scripts/check-pages.mjs
      - name: Prepara GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Carica il sito generato
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
